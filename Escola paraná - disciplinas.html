<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Escola_Parana.css">
    <title>Disciplinas - Escola Paraná</title>
</head>

<body>

    <titulo>Arquivo de disciplinas</titulo>

    <!-- ========================= -->
    <!-- PESQUISA DE DISCIPLINAS -->
    <!-- ========================= -->

    <div class="caixaPesquisa">
        <h2>Pesquisar disciplina</h2>

        <input
            class="form-container"
            type="text"
            id="codigoPesquisa"
            placeholder="Código da disciplina"
        >

        <button class="botao" onclick="buscarDisciplina()">
            Procurar
        </button>

        <div id="resultadoPesquisa"></div>
        <div id="resultadoCadastro"></div>


    <!-- ========================= -->
<!-- CADASTRAR PROVA           -->
<!-- ========================= -->
        <h2>Cadastrar Prova em uma Disciplina</h2>

        <input type="text" id="codigoDisciplinaProva" placeholder="Código da Disciplina (ex: D001)"></input>
        <input type="text" id="nomeProva" placeholder="Nome da Prova (ex: Prova Mensal - Cap. 3)"></input>
        <input type="date" id="dataProva"></input>
        <input type="text" id="conteudoProva" placeholder="Conteúdo cobrado (opcional)"></input>

        <button class="botao" onclick="cadastrarProva()">Cadastrar Prova</button>

        <div id="resultadoCadastroProva"></div>

  
    </div>




    <!-- BOTÃO VOLTAR -->
    <p>
        <a href="file:///C:/Kamili%20Servo/Pr%C3%A1tica%20profissional/Trabalho/Escola%20paran%C3%A1%20-%20primeira%20tela.html">
            <button class="botaoVoltar">voltar</button>
        </a>
    </p>
<script src="banco.js"></script>
<script src="disciplinas.js"></script>

    <script>


function horarioDisciplina(disciplina) {

    // Limpa as marcações anteriores
    let celulas = document.querySelectorAll("#tabelaHorario td");

    celulas.forEach(function(celula) {
        celula.innerHTML = "";
        celula.classList.remove("ocupado");
    });

    // Se não existe disciplina, não faz nada
    if (!disciplina) {
        return;
    }

    // Procura o dia e horário da disciplina
    let celula = document.querySelector(
        `#tabelaHorario td[data-dia="${disciplina.diaSemana}"][data-horario="${disciplina.horaInicio}"]`
    );

    // Marca a célula encontrada
    if (celula) {
        celula.innerHTML = `
            <strong>${disciplina.nome}</strong>
            <br>
            ${disciplina.horaInicio} às ${disciplina.horaFim}
        `;

        celula.classList.add("ocupado");
    }
}

        // =========================================
        // PESQUISAR DISCIPLINA
        // =========================================

        function buscarDisciplina() {

    let codigo = document
        .getElementById("codigoPesquisa")
        .value
        .trim()
        .toUpperCase();

    if (codigo === "") {

        document.getElementById("resultadoPesquisa").innerHTML = `
            <p>Digite o código da disciplina.</p>
        `;

        horarioDisciplina(null);

        return;
    }

    let disciplina = disciplinas.find(d => d.codigo === codigo);

    if (!disciplina) {

        document.getElementById("resultadoPesquisa").innerHTML = `
            <p>Disciplina não encontrada.</p>
        `;

        horarioDisciplina(null);

        return;
    }

    // Mostra as informações da disciplina
    document.getElementById("resultadoPesquisa").innerHTML = `
        <h3>${disciplina.nome}</h3>

        <p><strong>Código:</strong> ${disciplina.codigo}</p>

        <p><strong>Carga Horária:</strong> 
            ${disciplina.cargaHoraria}
        </p>

        <p><strong>Professor:</strong> 
            ${disciplina.professor}
        </p>

        <p><strong>E-mail:</strong> 
            ${disciplina.email}
        </p>

        <p><strong>Dia:</strong> 
            ${disciplina.diaSemana}
        </p>

        <p><strong>Horário:</strong> 
            ${disciplina.horaInicio} às ${disciplina.horaFim}
        </p>
        <p>Provas Agendadas:</>
                ${htmlProvas}
            `;


    // Marca o dia e horário na tabela
    horarioDisciplina(disciplina);
}

        // =========================================
        // CADASTRAR PROVA EM UMA DISCIPLINA
        // =========================================
        function cadastrarProva() {
            let codigo = document.getElementById("codigoDisciplinaProva").value.trim().toUpperCase();
            let nomeProva = document.getElementById("nomeProva").value.trim();
            let dataProva = document.getElementById("dataProva").value;
            let conteudoProva = document.getElementById("conteudoProva").value.trim();

            if (codigo === "" || nomeProva === "" || dataProva === "") {
                document.getElementById("resultadoCadastroProva").innerHTML = `
                    <p style="color: red;">Preencha o código, o nome da prova e a data.</p>
                `;
                return;
            }

            // Procura a disciplina onde a prova será associada
            let disciplina = disciplinas.find(d => d.codigo === codigo);

            if (!disciplina) {
                document.getElementById("resultadoCadastroProva").innerHTML = `
                    <p style="color: red;">Disciplina com o código <strong>${codigo}</strong> não foi encontrada.</p>
                `;
                return;
            }

            // Garante que o array de provas existe na disciplina
            if (!disciplina.provas) {
                disciplina.provas = [];
            }

            // Adiciona a nova prova
            disciplina.provas.push({
                nome: nomeProva,
                data: dataProva,
                conteudo: conteudoProva
            });

            document.getElementById("resultadoCadastroProva").innerHTML = `
                <p style="color: green;">Prova cadastrada com sucesso em <strong>${disciplina.nome}</strong>!</p>
            `;

            // Limpa os campos de cadastro de prova
            document.getElementById("codigoDisciplinaProva").value = "";
            document.getElementById("nomeProva").value = "";
            document.getElementById("dataProva").value = "";
            document.getElementById("conteudoProva").value = "";

            // Se a disciplina cadastrada for a que está aberta na busca, atualiza os dados
            if (document.getElementById("codigoPesquisa").value.trim().toUpperCase() === codigo) {
                buscarDisciplina();
            }
        }


        // =========================================
        // LIMPAR FORMULÁRIO
        // =========================================

        function limparCadastro() {
            document.getElementById("inputCodigo").value = "";
            document.getElementById("inputNome").value = "";
            document.getElementById("inputCargaHoraria").value = "";
            document.getElementById("inputProfessor").value = "";
            document.getElementById("inputEmailProfessor").value = "";
            document.getElementById("inputAno").value = "";
            document.getElementById("inputTurno").value = "";
        }

    </script>

</body>

</html>
